services:
  agileworks-mcp:
    build:
      context: .
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VERSION: R1.0.0
        MCP_PORT: ${MCP_PORT:-8002}
        IS_CLOUD: ${IS_CLOUD:-false}
    image: agileworks-mcp:R1.0.0
    container_name: agileworks_mcp
    # MCP_SERVER_BASE_URL などの設定をコンテナに渡す。.env.example をコピーして .env を作成すること
    env_file:
      - .env
    # 外部には公開せず、同じサーバー上のリバースプロキシ（nginx 等）からのみ接続させる
    ports:
      - "127.0.0.1:${MCP_PORT:-8002}:${MCP_PORT:-8002}"
    restart: always
