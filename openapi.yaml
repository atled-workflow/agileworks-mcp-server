              description: フォームコード
              type: string
            groupFormFieldId:
              description: 表明細フィールドID
              type: string
            columnList:
              description: 列項目リスト
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      type: 
                        allOf:
                        - $ref: "#/components/schemas/EnumDocViewColumnType"
                      fieldId:
                        description: フィールドID
                        type: string
        condition:
          description: 書類の検索条件
          type: object
          properties:
            criterionDate:
              description: 基準日
              type: string
              pattern: ^((19|20)[0-9]{2})-(1[0-2]|0[1-9])-(3[01]|0[1-9]|[12][0-9]) (2[0-3]|[01][0-9]):([0-5][0-9]):([0-5][0-9]) JST$
            userCode:
              description: ユーザーコード
              type: string
            docid:
              description: 書類ID
              type: integer
            adminNo:
              description: 書類管理番号
              type: string
            formCode:
              description: フォームコード
              type: string
            ruleCode:
              description: 回付ルールコード
              type: string
            ruleStepCode:
              description: 回付ルールステップコード
              type: string
            workflowState:
              allOf:
                - $ref: "#/components/schemas/EnumWorkflowStateType"
            listNameKeyword:
              description: 件名キーワード
              type: string
            dateCondition:
              description: 日付条件
              type: object
              properties:
                type:
                  allOf:
                    - $ref: "#/components/schemas/EnumDateConditionType"
                rangeType:
                  allOf:
                    - $ref: "#/components/schemas/EnumRangeType"
                from:
                  description: 日付指定の開始日
                  type: string
                  pattern: ^((19|20)[0-9]{2})-(1[0-2]|0[1-9])-(3[01]|0[1-9]|[12][0-9]) (2[0-3]|[01][0-9]):([0-5][0-9]):([0-5][0-9]) JST$
                to:
                  description: 日付指定の終了日
                  type: string
                  pattern: ^((19|20)[0-9]{2})-(1[0-2]|0[1-9])-(3[01]|0[1-9]|[12][0-9]) (2[0-3]|[01][0-9]):([0-5][0-9]):([0-5][0-9]) JST$
                dayFrom:
                  description: |
                    日付指定(日)の開始日数<br>
                    *0～9999
                    現在日から何日遡るかを指定する日数（過去の日付）。
                    例: 7 = 7日前から、30 = 30日前から
                    現在日が2025-12-03の場合、dayFrom=7は2025-11-26を意味します。
                  type: integer
                dayTo:
                  description: |
                    日付指定(日)の終了日数<br>
                    *0～9999
                    現在日から何日遡るかを指定する日数（過去の日付）。
                    例: 0 = 今日まで、1 = 昨日まで
                    現在日が2025-12-03の場合、dayTo=0は2025-12-03を意味します。
                    dayFromより小さい値を指定してください（dayFrom=7, dayTo=0で7日前から今日までの範囲）。
                  type: integer
                monthFrom:
                  description: |
                    日付指定(月)の開始月数<br>
                    *0～999
                    現在月から何ヶ月遡るかを指定する月数（過去の月）。
                    例: 3 = 3ヶ月前から、12 = 12ヶ月前から
                    現在月が2025-12の場合、monthFrom=3は2025-09を意味します。
                  type: integer
                monthTo:
                  description: |
                    日付指定(月)の終了月数<br>
                    *0～999
                    現在月から何ヶ月遡るかを指定する月数（過去の月）。
                    例: 0 = 今月まで、1 = 先月まで
                    現在月が2025-12の場合、monthTo=0は2025-12を意味します。
                    monthFromより小さい値を指定してください（monthFrom=3, monthTo=0で3ヶ月前から今月までの範囲）。
                  type: integer
                monthDayFrom:
                  description: |
                    日付指定(月)の開始日<br>
                    *1～31<br>
                    *存在しない日の場合は月末に丸められます
                    monthFromで指定した月の範囲内で、特定の日付を指定します（日数ではなく日付）。
                    例: monthDayFrom=15で各月の15日から、monthDayFrom=1で各月の1日から
                    monthFrom=3, monthDayFrom=15の場合、3ヶ月前の15日を意味します。
                  type: integer
                monthDayTo:
                  description: |
                    日付指定(月)の終了日<br>
                    *1～31<br>
                    *存在しない日の場合は月末に丸められます
                    monthToで指定した月の範囲内で、特定の日付を指定します（日数ではなく日付）。
                    例: monthDayTo=20で各月の20日まで、monthDayTo=31で各月の末日まで
                    monthTo=0 monthDayTo=20の場合、今月の20日を意味します。
            relativeConditionList:
              description: ユーザー関連条件リスト
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        allOf:
                          - $ref: "#/components/schemas/EnumRelativeType"
                      unitCode:
                        description: 組織コード
                        type: string
                      userCode:
                        description: ユーザーコード
                        type: string
                      userType:
                        allOf:
                          - $ref: "#/components/schemas/EnumRelativeUserType"
            logicalOperatorType:
              description: |
                フィールド値条件全体の AND / OR<br>
                *AND または OR を指定
              type: string
            fieldValueConditionList:
              description: フィールド値条件リスト
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        allOf:
                          - $ref: "#/components/schemas/EnumFieldValueType"
                      fieldId:
                        description: フィールドID
                        type: string
                      compareOperatorType:
                        allOf:
                          - $ref: "#/components/schemas/compareOperatorType"
                      value:
                        description: 値
                        type: string
                      valueFrom:
                        description: 値(From)
                        type: string
                      valueTo:
                        description: 値(To)
                        type: string
            fulltextSearchCondition:
              description: 全文検索条件
              type: object
              properties:
                logicalOperatorType:
                  description: |
                    全文検索条件全体の AND / OR<br>
                    *AND または OR を指定
                  type: string
                docContentQuery:
                  description: 書類内容[全文検索]
                  type: string
