              endpoint:
                description: |
                  エンドポイント<br>
                  Userスキーマの場合："/Users"固定<br>
                  Groupスキーマの場合："/Groups"固定
                type: string
              description:
                description: |
                  説明<br>
                  Userスキーマの場合："User Account"固定<br>
                  Groupスキーマの場合："Group"固定
                type: string
              schemaExtensions:
                description: |
                  スキーマ拡張のリスト<br>
                  Groupスキーマの場合は無し
                type: object
                properties:
                  schema:
                    description: |
                      拡張スキーマのURI<br>
                      "urn:ietf:params:scim:schemas:extension:enterprise:2.0:User" 固定
                    type: string
                  required:
                    description: |
                      スキーマ拡張フラグ<br>
                      リソースタイプにスキーマ拡張が必要かどうかを示すフラグ
                    type: boolean
              schema:
                description: |
                  スキーマ<br>
                  Userスキーマの場合："urn:ietf:params:scim:schemas:core:2.0:User"固定<br>
                  Groupスキーマの場合："urn:ietf:params:scim:schemas:core:2.0:Group"固定
                type: string
              schemas:
                description: |
                  スキーマ<br>
                  "urn:ietf:params:scim:schemas:core:2.0:ResourceType" 固定
                type: string
    
    SCIMSchemasResponse:
      type: object
      properties:
        schemas:
          description: |
            応答時のスキーマタイプ<br>
            *"urn:ietf:params:scim:api:messages:2.0:ListResponse" 固定
          type: string
        totalResults:
          description: |
            検索結果件数<br>
            *リソースの件数
          type: integer
        Resources:
          description: リソース情報
          type: array
          items:
            type: object
            properties:
              id:
                description: |
                  ID<br>
                  Userスキーマの場合："urn:ietf:params:scim:schemas:core:2.0:User"固定<br>
                  Groupスキーマの場合："urn:ietf:params:scim:schemas:core:2.0:Group"固定
                type: integer
              name:
                description: |
                  名称<br>
                  Userスキーマの場合："User"固定<br>
                  Groupスキーマの場合："Group"固定
                type: string
              description:
                description: |
                  説明<br>
                  Userスキーマの場合："User"固定<br>
                  Groupスキーマの場合："Group"固定
                type: string
              attributes:
                description: 属性
                type: array
                items:
                  type: object
                  properties:
                    name:
                      description: 属性名称
                      type: string
                    description:
                      description: 説明
                      type: string
                    multiValued:
                      description: 属性が複数の値を持つかどうかを示す属性
                      type: boolean
                    type:
                      description: |
                        属性のタイプ（型）を示す属性<br>
                        boolean, decimal, integer, dateTime, reference, complex
                      type: string
                    required:
                      description: 属性が必須かどうかを指定するブール値
                      type: boolean
                    mutability:
                      description: |
                        属性に関する変更可能性<br>
                        mutable（変更可能）<br>
                        immutable（変更不可能）<br>
                        read-only（読み取り専用）<br>
                      type: string
                    caseExact:
                      description: 属性が大文字と小文字を区別するかどうかを指定するブール値
                      type: boolean
                    returned:
                      description: |
                        属性が検索結果に含まれるかどうかを示す属性<br>
                        always（常に返される）<br>
                        default（デフォルトで返される）<br>
                        never（決して返されない）
                      type: string
                    uniqueness:
                      description: |
                        属性における一意性（uniqueness）の制約を定義するための属性<br>
                        server（サーバー管理の一意性）<br>
                        global（グローバル一意性）<br>
                        uniqueness（一意性の制約なし）    
    
    SCIMServiceResponse:
      type: object
      properties:
        schemas:
          description: |
            スキーマ情報<br>
            *"urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig " 固定
          type: string
        patch:
          description: パッチ
          type: object
          properties:
            supported:
              description: |
                サポート有無<br>
                *true固定
              type: boolean
        bulk:
          description: バルク
          type: object
          properties:
            supported:
              description: |
                サポート有無<br>
                *false固定
              type: boolean
            maxOperation:
              description: |
                最大操作数<br>
                バルクリクエスト内で許可される操作の最大数を示します。<br>
                *0固定
              type: integer
            maxPayloadSize:
              description: |
                最大サイズ<br>
                バルクリクエストのペイロード（データのサイズ）に許可される最大サイズを示します。<br>
                *0固定
              type: integer
        filter:
          description: フィルター
          type: object
          properties:
            supported:
              description: |
                サポート有無<br>
                *true固定
              type: boolean
            maxResults:
              description: |
                最大検索数<br>
                *1000固定
              type: integer
        changePassword:
          description: パスワード変更有無
          type: object
          properties:
            supported:
              description: |
                サポート有無<br>
                *true固定
              type: boolean
        sort:
          description: ソート
          type: object
          properties:
            supported:
              description: |
                サポート有無<br>
                *false固定
              type: boolean
        etag:
          description: etag
          type: object
          properties:
            supported:
              description: |
                サポート有無<br>
                *false固定
              type: boolean
        authenticationSchemas:
          description: 認証スキーマ
          type: array
          items:
            type: object
            properties:
              type:
                description: |
                  認証スキーマ種別<br>
                  Oauth2認証の場合："oauth2"固定<br>
                  Basic認証の場合："httpbasic"固定
                type: string
              name:
                description: |
                  認証名称<br>
                  Oauth2認証の場合："oauth2"固定<br>
                  Basic認証の場合："httpbasic"固定
                type: string
              description:
                description: |
                  認証の説明<br>
                  Oauth2認証の場合："oauth2"固定<br>
                  Basic認証の場合："httpbasic"固定
                type: string
              specUri:
                description: |
                  認証仕様URI<br>
                  Oauth2認証の場合："https://datatracker.ietf.org/doc/html/rfc6749"固定<br>
                  Basic認証の場合："https://datatracker.ietf.org/doc/html/rfc7617"固定
                type: string
              primary:
                description: |
                  優先<br>
                  Oauth2認証の場合："TRUE"固定、Basic認証の場合："FALSE"固定

