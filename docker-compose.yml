version: '3.8'
services:
  agileworks-mcp:
    build: 
      context: .
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VERSION: ${VERSION:-0.1.0}
    image: agileworks-mcp:${VERSION:-0.1.0}
    container_name: agileworks_mcp
    # .envを用意する場合は以下の設定が必要
    # 反対に.envを用意しない場合はenv_fileを削除すること
    env_file:
      - .env
    volumes:
      - ./:/app
    ports:
      - "8002:8002"
    restart: always